; PlatformIO Project Configuration File
;
; This sample drives an M5Stack ATOM S3 + STEP/DIR stepper driver.
; It defaults to a BIGTREETECH TMC2209 V1.2 compatible driver with UART setup.

[platformio]
default_envs = m5stack-atoms3

[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
build_flags =
  -DACTIVE_DRIVER=DRIVER_TMC2209
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  m5stack/M5Unified
  waspinator/AccelStepper
  teemuatlut/TMCStepper

[env:m5stack-atoms3-a4988]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
build_flags =
  -DACTIVE_DRIVER=DRIVER_A4988
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  m5stack/M5Unified
  waspinator/AccelStepper
  teemuatlut/TMCStepper

[env:m5stack-atoms3-gpio8-test]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
build_flags =
  -DACTIVE_DRIVER=DRIVER_TMC2209
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DDIAG_GPIO8_TOGGLE=1
lib_deps =
  m5stack/M5Unified
  waspinator/AccelStepper
  teemuatlut/TMCStepper
